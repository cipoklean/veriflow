[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
# NEW-05: BootstrapVeriFlow reads deployed addresses from the latest
# DeployVeriFlow broadcast JSON (single source of truth). Allow the script to
# read broadcast artifacts.
fs_permissions = [{ access = "read", path = "./broadcast" }]

[profile.ci]
fuzz = {runs = 10000}
invariant = {runs = 100, depth = 50}

[fmt]
bracket_spacing = true
int_indent = "  "
line_length = 120
tab_width = 4

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
base_sepolia = "https://sepolia.base.org"